[project]
name = "trading"
version = "0.1.0"
description = "Autonomous trading platform for Indian markets with a deterministic live path"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
]

# Phase 1 and later. Unused in Phase 0; declared so the pin is visible.
[project.optional-dependencies]
data = [
    "polars>=1.9",
    "duckdb>=1.1",
    "httpx>=0.27",
    "fyers-apiv3>=3.0",
    "protobuf>=5.26",
]
news = ["httpx>=0.27", "defusedxml>=0.7.1"]
sentiment = ["transformers>=4.44", "torch>=2.4"]
quant = ["QuantLib>=1.36"]

[project.scripts]
trading = "trading.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "ruff>=0.6",
    "pytest>=8.3",
    "hypothesis>=6.112",
    "types-pyyaml>=6.0",
    "types-defusedxml>=0.7.0",
    "httpx>=0.27",
    "defusedxml>=0.7.1",
    "polars>=1.9",
    "duckdb>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading"]
artifacts = ["src/trading/py.typed", "src/trading/storage/schema.sql"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "UP",          # pyupgrade
    "B",           # bugbear
    "ANN",         # missing annotations
    "S",           # bandit
    "DTZ",         # naive datetime usage
    "RUF",
    "SIM",
    "TID",         # banned and relative imports
    "PL",
    "N",
]
ignore = [
    "ANN401",      # Any is occasionally required for validator plumbing
    "PLR0913",     # contracts legitimately have many fields
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, construct deliberately invalid values and need naive datetimes
# to prove they are rejected.
"tests/**" = ["S101", "S105", "S106", "S603", "S607", "DTZ001", "DTZ003", "DTZ005", "PLR2004", "ANN001", "ANN401", "ANN201", "ANN202", "ANN205", "E501", "PLC0415", "RUF002", "N817", "RUF043", "PLR0915"]
"tests/paper_positional_sim/**" = ["E501"]
"src/trading/storage/trading_store.py" = ["E501", "S608"]
"src/trading/runtime/paper_session.py" = ["E501", "PLR0912", "PLR0915", "PLC0415"]
"src/trading/analytics/monthly_meta_report.py" = ["PLR2004"]
"src/trading/analytics/bias.py" = ["PLR2004"]
# isort order for trading.config vs trading.data.* differs macOS vs Linux.
"tests/test_data_pipeline.py" = ["I001"]
"src/trading/data/replay.py" = ["I001"]
"src/trading/data/normalize.py" = ["PLR0912"]
"src/trading/data/quality.py" = ["PLR0912", "PLR0915"]
"src/trading/data/snapshot_builder.py" = ["PLR0912", "PLR0915"]
"src/trading/data/storage/catalog.py" = ["PLC0415", "S608"]
"src/trading/data/pipeline.py" = ["I001", "PLR0912", "PLR0915"]
"src/trading/data/fyers/auth.py" = ["PLC0415", "PLR0911"]
"src/trading/data/fyers/ws.py" = ["PLC0415", "PLR0912", "PLR0915"]
"src/trading/data/cas_depth/collector.py" = ["PLC0415", "S110", "S112", "E501"]
"src/trading/data/cas_depth/*.py" = ["PLR2004", "E501", "SIM103"]
"scripts/cas_depth_*.py" = ["E501"]
"src/trading/data/fyers/capability_probe.py" = [
    "E501", "S110", "S112", "SIM105", "SIM108", "PLC0415",
    "PLR0912", "PLR0915", "PLR2004", "RUF007",
]
"scripts/fyers_tbt_capability_probe.py" = ["E501", "PLR0915"]
"tests/test_fyers_tbt_capability_probe.py" = ["E501"]
"src/trading/cli.py" = ["E501", "PLR0912", "PLR0915", "PLC0415"]
"src/trading/runtime/paper_runner.py" = ["E501", "PLR0911", "PLR0912", "PLR0915"]
"src/trading/risk/snapshot_bundle.py" = ["PLR0911"]
"src/trading/ai/tools.py" = ["PLR0912", "PLR2004"]
"src/trading/ai/loop.py" = ["PLR0911"]
"src/trading/data/cas_features.py" = ["PLR2004"]
"src/trading/analytics/scorecard.py" = ["PLR0912", "PLR0915"]
"src/trading/analytics/eligibility.py" = ["PLR0912"]
"src/trading/news/scoring.py" = ["PLR0912", "PLR0915"]
"src/trading/news/sources.py" = ["PLR0912"]
"src/trading/risk/gateway.py" = ["PLR0911", "PLR0912", "PLR0915"]
"src/trading/identification/binders.py" = ["PLR0912", "PLR2004"]
"src/trading/risk/affordability.py" = [
    "E501", "PLR0912", "PLR0915", "PLR0917", "PLR2004", "B008", "S112", "RUF001",
]
"src/trading/risk/payoff.py" = ["PLR0911", "PLR0912", "PLR2004"]
"src/trading/risk/sizing/butterfly.py" = ["PLR2004"]
"src/trading/risk/sizing/iron_butterfly.py" = ["PLR2004"]
"src/trading/portfolio/arbitration.py" = ["B023", "E501", "PLR0912", "PLR0915"]
"src/trading/portfolio/campaign_drawdown.py" = ["E501"]
"src/trading/portfolio/counterfactual_book.py" = ["E501"]
"src/trading/portfolio/economic_overlap.py" = ["E501", "PLC0415", "PLR0911"]
"src/trading/strategies/m4_broad_basket.py" = ["E501", "PLR0911", "PLR2004"]
"src/trading/runtime/cas_event_path.py" = ["E501", "PLR0912"]
"src/trading/risk/mode_ledger.py" = ["PLR0917"]
"src/trading/storage/schema_migration.py" = ["PLC0415", "S608"]
"src/trading/trade/roll_switch.py" = ["PLR0911"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true
strict = true
warn_unreachable = true
warn_no_return = true
disallow_any_unimported = true
disallow_any_generics = true
no_implicit_reexport = true
show_error_codes = true
# Safety invariant 23: no silent escape hatches. An ignore must name its code.
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
module = ["fyers_apiv3", "fyers_apiv3.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "trading.runtime.protection",
    "trading.runtime.watchdog",
    "trading.data.fyers.capability_probe",
    "tests.test_paper_protection",
]
# WIP until QuoteUpdateResult / PaperSessionConfig.protection are wired.
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "tests.test_p1_mode_policy_and_gateway",
    "tests.test_p2_four_ledgers_and_reservations",
    "tests.test_p2_mode_ledgers_and_reservations",
    "tests.test_p4_producers_and_arbiter",
    "tests.test_p6_credit_verticals_and_g2",
    "tests.test_p7_m1_selector_and_g3_path",
    "tests.test_p8_whole_structure_spread_valuation",
    "tests.test_p10_iron_condor_binder_and_g2",
    "tests.test_p11_m4_broad_basket",
    "tests.test_p12_economic_overlap_m4_cap",
    "tests.test_p13_positional_reviews",
    "tests.test_p14_calendar_research_registry",
    "tests.test_audit_remediation",
    "tests.test_fill_charges",
    "tests.structures",
]
# Phase verification suites use dynamic fixtures; typed at runtime via factories.
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error"]
