[project]
name = "trading"
version = "0.1.0"
description = "Autonomous trading platform for Indian markets with a deterministic live path"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
]

# Phase 1 and later. Unused in Phase 0; declared so the pin is visible.
[project.optional-dependencies]
data = ["polars>=1.9", "duckdb>=1.1"]
quant = ["QuantLib>=1.36"]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "ruff>=0.6",
    "pytest>=8.3",
    "hypothesis>=6.112",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "UP",          # pyupgrade
    "B",           # bugbear
    "ANN",         # missing annotations
    "S",           # bandit
    "DTZ",         # naive datetime usage
    "RUF",
    "SIM",
    "TID",         # banned and relative imports
    "PL",
    "N",
]
ignore = [
    "ANN401",      # Any is occasionally required for validator plumbing
    "PLR0913",     # contracts legitimately have many fields
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, construct deliberately invalid values and need naive datetimes
# to prove they are rejected.
"tests/**" = ["S101", "DTZ001", "DTZ003", "DTZ005", "PLR2004", "ANN401"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
warn_unreachable = true
warn_no_return = true
disallow_any_unimported = true
disallow_any_generics = true
no_implicit_reexport = true
show_error_codes = true
# Safety invariant 23: no silent escape hatches. An ignore must name its code.
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error"]
