# M2-only operating policy (Oracle branch M2).
# Denominator for risk fractions is M2 reference capital (100% of book).

schema_version: "1"

modes:
  M2_DIRECTIONAL:
    mode_id: M2_DIRECTIONAL
    mandate: "Directional single-leg long options with active daily evaluation."
    capital_share: "1.0"
    per_trade_loss_cap_fraction: "0.04"
    max_open_loss_cap_fraction: "0.06"
    daily_budget_cap_fraction: "0.08"
    allowed_families:
      - long_call
      - long_put
    holding_style: "INTRADAY"
    window_start_ist: "09:15"
    window_end_ist: "15:30"
    expiry_rule: "following_calendar_week_exclude_0_1_dte"
    review_cadence:
      - "10:30"
      - "14:30"
