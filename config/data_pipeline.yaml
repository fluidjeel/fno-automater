# Phase 1 data pipeline. Paths are relative to the repo root on the VM.
schema_version: "1"
normalization_version: "1"

storage:
  root: data
  raw_subdir: raw
  canonical_subdir: canonical
  duckdb_path: data/catalog.duckdb
  parquet_subdir: parquet
  snapshot_subdir: snapshots

# Fyers hybrid model: REST quotes/bars/chain/depth on a schedule; websocket
# ticks via `trading data stream` (optional --daemon).
fyers:
  option_chain_strike_count: 25
  poll_interval_seconds: 60
  bar_resolutions: ["5"]
  bar_lookback_days: 5
  chain_greeks: true
  history_oi_flag: true
  fetch_depth: true
  fetch_market_status: true
  fetch_expiry_dates: true
  greeks_calculation_version: fyers_chain
  ws_channel: 11
  ws_max_ticks: 100
  ws_duration_seconds: 60
  ws_reconnect: true
  ws_reconnect_attempts: 5
  ws_reconnect_backoff_seconds: 1.0

# Instrument reference data. The public symbol master is the authority for lot
# and tick sizes; nothing here may be a remembered value.
reference:
  instrument_subdir: reference/instruments
  symbol_master_url_template: "https://public.fyers.in/sym_details/{segment}_sym_master.json"
  segments: ["NSE_CM", "NSE_FO"]
  timeout_seconds: 60.0
  # Fyers `exInstType` for a cash-segment index row, observed on
  # NSE:NIFTY50-INDEX in NSE_CM_sym_master.json.
  index_instrument_type: 10
  # Per-request window from the official v3 history documentation: 100 days for
  # the listed minute resolutions, 366 days for 1D. Seconds resolutions are
  # omitted because only an availability window (30 trading days) is published,
  # not a per-request cap, so a seconds backfill fails closed.
  history_max_days_by_resolution:
    "1": 100
    "2": 100
    "3": 100
    "5": 100
    "10": 100
    "15": 100
    "20": 100
    "30": 100
    "45": 100
    "60": 100
    "120": 100
    "180": 100
    "240": 100
    "D": 366
    "1D": 366

# Exchange-local cash/FO window. Hours must match current official NSE
# documentation; an unrecorded verified_at fails closed (no new exposure).
session:
  timezone: Asia/Kolkata
  open_local: "09:15"
  close_local: "15:30"
  verified_source: "https://www.nseindia.com/resources/exchange-communication-holidays-price-bands"
  verified_at: "2026-09-13"
  segment: NSE_FO

quality:
  min_bar_count: 1
  min_strike_count: 1
  max_clock_drift_ms: 5000
  clock_drift_invalid: false
  max_cross_source_bps: 50
  max_spread_bps: 50

# Research-stage structured classifications from trusted sources. The numeric
# parameters require validation before strategy use; no free-text AI scoring is
# performed in the live pipeline.
macro_news:
  input_file: data/macro_news.jsonl
  max_age_seconds: 604800
  half_life_seconds: 86400
  calculation_version: macro-news-linear-decay-v1

# Per-underlying freshness for the POC positional strategy (not universal).
freshness:
  option_chain_max_age_ms:
    "5m": 120000
  quote_max_age_ms:
    "5m": 60000
  bar_max_age_ms:
    "5m": 300000
  tick_max_age_ms:
    "5m": 5000
  depth_max_age_ms:
    "5m": 60000
  market_status_max_age_ms:
    "5m": 60000

underlyings:
  - symbol: "NSE:NIFTY50-INDEX"
    feature_set_version: "nifty_index_v1"
    exchange: NSE
    underlying: NIFTY
    instrument_kind: INDEX
    asset_class: EQUITY_INDEX
