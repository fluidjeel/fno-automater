# Layer 4 forward-validation thresholds. Freeze before scoring a cohort.
# Changing any value starts a new evaluation lineage (checksum).
#
# Charges remain unverified on purpose: net P&L fails closed until a current
# broker/tax schedule is recorded with verified_at.

schema_version: "1"
policy_version: "1"

fill_model:
  version: "conservative-v1"
  slippage_ticks: 1
  legging_delay_ticks: 2
  require_traded_through: true
  charges_per_lot:
    # Conservative ROUND-TRIP INR per lot for NSE index OPTIONS on Fyers.
    # Built 2026-09-19 from https://fyers.in/charges-list + Finance Act STT
    # (options sell STT 0.15% of premium w.e.f. 2026-04-01). Assumed Nifty
    # lot=75 and ~₹200–250 premium; higher premiums cost more (mostly STT).
    # Multi-leg structures should scale by filled lots (and by legs in sizing).
    value: "100"
    source: "https://fyers.in/charges-list + NSE/STT schedule (Finance Act 2026)"
    verified_at: "2026-09-19"
    note: >-
      Round-trip estimate: brokerage ₹20×2; STT 0.15% sell premium; NSE txn
      ~0.0355299% premium both sides; clearing ~0.009% premium both sides;
      SEBI ₹10/cr; NSE IPFT ₹50/cr options; stamp 0.003% buy; GST 18% on
      (brokerage+exchange+clearing+SEBI+IPFT). At ₹200 premium ≈₹86; buffer
      to ₹100. Not a substitute for a contract note on a live account.

eligibility:
  min_observation_days: 60
  min_signals: 100
  min_closed_trades: 60
  min_expectancy_amount: "0"
  max_drawdown_amount: "50000"
  max_consecutive_losses: 8
  min_fill_rate: "0.50"
  max_reject_rate: "0.30"
  max_average_slippage_amount: "500"
  max_single_trade_pnl_share: "0.50"
  min_regime_count: 3
  min_profit_factor: "1.20"
  require_positive_expectancy_lower_95: true
  require_daily_reconciliation: true
  require_no_p0_p1: true
  require_confirmed_costs: true
  currency: INR


# Offline judgment harness (P2.1). Labels should_enter when
# (MFE − charges_per_lot×lots) clears min_net_mfe_amount and beats MAE.
judgment:
  min_net_mfe_amount: "0"
  require_mfe_beats_mae: true
  min_precision: "0.55"
  min_capture: "0.50"
  max_brier: "0.25"
  currency: INR
