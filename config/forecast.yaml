  swing_lookback_bars: 30
  daily_trend_sma: 20
  debit_max_iv_percentile: "45"
  credit_min_iv_percentile: "55"
  credit_short_quantile: "0.80"
  debit_target_quantile: "0.65"
  credit_width_points: "200"
  invalidation_buffer_atr: "0.25"
  model:
    intercept: "0"
    coefficients:
      daily_trend: "0.25"
      swing_structure: "0.30"
      momentum_5d: "0.20"
      range_position: "-0.20"
      fii_positioning: "1.0"
      macro_bias: "0.20"

m4:
  enforce: false
  enforce_exits: false
  horizon_minutes: 5625
