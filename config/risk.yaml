# Layer 2 risk policy: strategy allocation, concentration and premium budgets.
# Account-level loss caps live in base.yaml (risk.*). This file scopes capital
# across strategies and structures without hard-coding limits in domain logic.

schema_version: "1"
policy_version: "6"

strategy_allocations:
  positional_long_option:
    allocation_fraction: "0.20"
  positional_index_options_poc:
    allocation_fraction: "0.20"
  commodity_futures_trend:
    allocation_fraction: "0.20"
  debit_spread:
    allocation_fraction: "0.05"
  defined_risk_multileg:
    allocation_fraction: "0.05"
  cas_microstructure:
    allocation_fraction: "0.05"
  directional_conviction:
    allocation_fraction: "0.15"

underlying_concentration_fraction: "0.25"
options_premium_budget_fraction: "0.15"
slippage_buffer_fraction: "0.0025"

# Naked short options stay disabled unconditionally. A single-leg commodity
# futures short is a different risk class: its loss is bounded by the protective
# stop that sized it (stop distance x lot value == the approved risk), which is
# the same bound a long future already runs under. Enabling this admits only
# that one structure; every other SELL leg must still be structurally capped.
allow_stop_bounded_futures_short: true

charges_per_lot:
  amount: "50"
  currency: INR

net_delta_limit: 500
# ADESK-A4 / PART 6 — portfolio shared-fate arithmetic (index-equivalent).
net_vega_limit: "5000"
expiry_day_notional_fraction: "0.35"
directional_agreement_max: "0.85"
single_event_exposure_fraction: "0.25"
# ADESK-A5 / PART 8 — freeze entries when stress worst-case exceeds this.
tail_budget_fraction: "0.08"
# Four-mode aggregate open-risk envelope. Enforced in Layer 2 at decision time.
max_global_open_risk:
  amount: "35000"
  currency: INR
decision_ttl_seconds: 300

# PAPER-only SPAN substitute for live futures symbols. Not exchange SPAN.
# Unset (null) refuses commodity paper sizing. Never used on a live broker.
paper_future_margin_fraction: "0.15"

# Open-position monitor-leg gap: HALT_ONLY freezes entries and alerts.
# FLATTEN_REMAINING submits opposite LIMITs only for still-quoted legs.
missing_monitor_resolution: HALT_ONLY
