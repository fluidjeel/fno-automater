# Active PAPER session — M2-only (branch M2 / Oracle deploy).
# Rollback four-mode: cp config/paper_session_four_mode.yaml config/paper_session.yaml
# Rollback DISCOVERY: set entry_profile: STRICT (or remove it) and restart;
#   positions opened under DISCOVERY keep their frozen exit policy.
schema_version: "1"
routing_profile: m2_only
entry_profile: DISCOVERY
new_entries_enabled: true
poll_interval_seconds: 60
eod_local: "15:40"
option_strikes_each_side: 2
experiment_prefix: "EXP-DISC"
mode_stances:
  M2_DIRECTIONAL: PAPER
  M1_CAS: SUSPENDED
  M3_TACTICAL_POSITIONAL: SUSPENDED
  M4_STRATEGIC_POSITIONAL: SUSPENDED
family_stances:
  long_straddle: SUSPENDED
  long_strangle: SUSPENDED
  long_call_calendar: SUSPENDED
  long_put_calendar: SUSPENDED
commodity_underlying: CRUDEOIL
commodity_exchange: MCX
commodity_segment: MCX_COM
cohort_dir: data/paper/cohorts
store_path: data/paper/trading.sqlite
broker_state_path: data/paper/broker_state.json
portfolio_risk_dir: data/paper/portfolio_risk
session_heartbeat_path: data/paper/session_heartbeat.json
positional_review:
  nse_slots:
    - id: NSE_MORNING
      local: "10:30"
    - id: NSE_AFTERNOON
      local: "14:30"
  mcx_slots: []
cas_event_driven:
  enabled: false
  profile: quote_only
  quote_max_age_ms: 500
  max_entry_latency_ms: 2000
  max_execution_latency_ms: 2000
  max_exit_monitor_gap_ms: 2000
  microprice_dislocation_ticks: "2"
  min_top_book_size: 1
  daily_loss_budget_fraction: "0.15"
  max_attempts_per_session: 20
  episode_retry_limit: 1
  prefer_delta_min: "0.15"
  prefer_delta_max: "0.40"
  measured_latency_path: data/paper/m1_latency_report.json
protection:
  ws_enabled: false
  rest_poll_seconds: 3
  watchdog_max_silence_seconds: 180
