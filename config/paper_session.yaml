# Active PAPER session — M2-only (branch M2 / Oracle deploy).
schema_version: "1"
routing_profile: m2_only
entry_profile: DISCOVERY
new_entries_enabled: true
poll_interval_seconds: 60
eod_local: "15:40"
option_strikes_each_side: 2
experiment_prefix: "EXP-DISC"
mode_stances:
  M2_DIRECTIONAL: PAPER
family_stances:
  long_straddle: SUSPENDED
  long_strangle: SUSPENDED
  long_call_calendar: SUSPENDED
  long_put_calendar: SUSPENDED
commodity_underlying: CRUDEOIL
commodity_exchange: MCX
commodity_segment: MCX_COM
cohort_dir: data/paper/cohorts
store_path: data/paper/trading.sqlite
broker_state_path: data/paper/broker_state.json
portfolio_risk_dir: data/paper/portfolio_risk
session_heartbeat_path: data/paper/session_heartbeat.json
positional_review:
  nse_slots:
    - id: NSE_MORNING
      local: "10:30"
    - id: NSE_AFTERNOON
      local: "14:30"
  mcx_slots: []
protection:
  ws_enabled: false
  rest_poll_seconds: 3
  watchdog_max_silence_seconds: 180
