schema_version: "1"
profile_version: "discovery-v1"
books:
  starting_equity_per_mode: "700000"
  compounding: DAILY_REALIZED_NET
  drawdown_alert_fraction: "0.20"
max_lots_per_trade: 2
family_stances:
  long_straddle: SUSPENDED
  long_strangle: SUSPENDED
modes:
  M2_DIRECTIONAL:
    per_trade_guide: "0.02"
    open_risk_cap: "0.12"
    max_new_entries_per_day: 4
    max_open_positions: 1
bug_guard_trade_risk_fraction: "0.10"
strict_quote_max_age_ms: 120000
cas_strict_quote_max_age_ms: 30000
hard_quote_max_age_ms: 300000
min_dte_new_entry:
  default: 1
  M2_DIRECTIONAL: 2
fills:
  model: "touch-v1"
  shadow_model: "conservative-v1"
soft_reason_codes:
  - MARGIN_INSUFFICIENT
  - MARGIN_OVERSUBSCRIBED
  - EVENT_BLACKOUT
  - MIN_LOT_EXCEEDS_BUDGET
  - DEPTH_INSUFFICIENT
  - SLIPPAGE_EXCEEDED
  - SPREAD_TOO_WIDE
  - SETUP_COOLDOWN
  - WARMUP_INCOMPLETE
  - RISK_LIMIT_DAILY_LOSS
  - RISK_LIMIT_STRATEGY
  - RISK_LIMIT_TRADE
  - RISK_LIMIT_PORTFOLIO
  - CONCENTRATION_LIMIT
  - CAMPAIGN_LOSS_LIMIT
  - EXACT_DUPLICATE_SUPPRESSED
  - ECONOMIC_OVERLAP_SUPPRESSED
  - OPPOSING_EXPOSURE_REJECTED
  - M4_POSITION_CAP_REACHED
  - DAILY_ENTRY_CAP
  - OPEN_POSITION_CAP
  - CAPITAL_UNAVAILABLE
selection:
  m2_delta:
    strict: ["0.45", "0.65"]
    fallback: ["0.30", "0.70"]
  m1_delta:
    strict: ["0.20", "0.40"]
    fallback: ["0.10", "0.50"]
  long_delta:
    strict: ["0.45", "0.60"]
    fallback: ["0.30", "0.70"]
  short_delta:
    strict: ["0.20", "0.35"]
    fallback: ["0.10", "0.45"]
  min_open_interest:
    strict: 1000
    fallback: 100
  max_spread_fraction:
    strict: "0.05"
    fallback: "0.10"
  weekly_dte:
    strict: [5, 12]
    fallback: [2, 14]
  near_strikes_each_side: 5
  following_week_strikes_each_side: 10
direction:
  fallback_trend_threshold: "0.30"
  fallback_min_bars: 14
exits:
  leg_stop_fraction: "0.35"
  leg_target_fraction: "0.80"
  short_leg_stop_multiple: "2.0"
  short_leg_target_fraction: "0.50"
  trail_activate_fraction: "0.30"
  trail_giveback_fraction: "0.50"
  confirm_quotes: 2
  credit_target_fraction: "0.60"
  credit_stop_max_loss_fraction: "0.90"
  rest_batch_size: 50
