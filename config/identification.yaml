# PAPER-only identification hypotheses. Every change starts a new cohort.
schema_version: "1"
policy_version: "nifty-identification-v1"
feature_version: "nifty-market-state-v1"
binding_version: "nifty-contract-binding-v2"
router_version: "nifty-structure-router-v3"
# Verified in Fyers NSE_CM instrument master (token 26017).
vix_symbol: "NSE:INDIAVIX-INDEX"

warmup:
  min_completed_bars: 50
  min_sessions: 20

regime:
  trend_threshold: "0.60"
  range_threshold: "0.25"
  volatility_expansion_ratio: "1.25"
  volatility_compression_ratio: "0.80"

contracts:
  min_open_interest: 1000
  max_spread_fraction: "0.05"
  long_delta_min: "0.45"
  long_delta_max: "0.60"
  short_delta_min: "0.20"
  short_delta_max: "0.35"
  weekly_dte_min: 5
  weekly_dte_max: 12
  monthly_dte_min: 20
  monthly_dte_max: 35
  min_reward_risk: "1.50"
  estimated_round_trip_cost_per_lot: "200"

router:
  low_iv_percentile: "40"
  low_iv_rv_ratio: "1.15"
  min_winner_score: "0.70"
  min_score_gap: "0.10"
  cooldown_minutes: 30


allow_table:
  high_iv_percentile: "70"
  # IST half-open windows [start, end)
  auction_windows_ist:
    - {start: "09:00", end: "09:15"}
    - {start: "15:30", end: "15:40"}
  continuous_window_ist: {start: "09:15", end: "15:30"}
  # NSE F&O close window. Half-open [start, end). Matches cas-microstructure-v1.
  cas_windows_ist:
    - {start: "15:00", end: "15:30"}
  rules:
    # Directional continuous / auction: long option + debit spread
    - trend: [UP, DOWN]
      volatility: ["*"]
      iv_bucket: [LOW, MID, HIGH]
      event: [NORMAL, CAUTION]
      session: [CONTINUOUS, AUCTION]
      allowed_families: [positional_long_option, debit_spread]
    # Range + high IV: defined-risk multileg + debit (hard filter also requires HIGH+RANGE)
    - trend: [RANGE]
      volatility: ["*"]
      iv_bucket: [HIGH]
      event: [NORMAL, CAUTION]
      session: [CONTINUOUS, AUCTION]
      allowed_families: [defined_risk_multileg, debit_spread]
    # CAS: YAML matches auction + continuous; hard filter keeps close window + auction
    - trend: ["*"]
      volatility: ["*"]
      iv_bucket: [LOW, MID, HIGH]
      event: [NORMAL, CAUTION]
      session: [AUCTION, CONTINUOUS]
      allowed_families: [cas_microstructure, positional_long_option, debit_spread]
