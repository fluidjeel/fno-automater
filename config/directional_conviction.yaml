# Directional conviction strategy configuration.
# PAPER-only hypotheses. Every change starts a new cohort.

schema_version: "1"
strategy_version: "directional-conviction-v1"

# Position limits
max_long_positions: 3
max_short_positions: 2
max_total_positions: 5

# Risk per trade (base, before regime adjustment)
requested_risk_inr: "10000"

# Option selection
min_days_to_expiry: 10
max_days_to_expiry: 25
preferred_delta_min: "0.55"
preferred_delta_max: "0.65"
min_open_interest: 1000
max_entry_spread_fraction: "0.05"

# VIX-based DTE adjustment
high_vix_threshold: "20"
high_vix_dte_min: 20
high_vix_dte_max: 30
low_vix_threshold: "13"
low_vix_dte_min: 10
low_vix_dte_max: 15
normal_dte_min: 10
normal_dte_max: 25

# Exit management
stop_ticks: 30
target_ticks: 60
trailing_activation_ticks: 40
trailing_distance_ticks: 20
exit_before_expiry_days: 2
entry_timeout_seconds: 30
intent_ttl_seconds: 300

# EOD carry-forward
eod_scan_time_ist: "15:15"
eod_close_deadline_ist: "15:25"
min_conviction_for_carry: "65"
positional_stop_atr_multiplier: "2.0"

# Regime thresholds
regime:
  strong_bull_breadth_min: "60"
  mild_bull_breadth_min: "40"
  strong_bear_breadth_max: "40"
  low_vix_threshold: "15"
  high_vix_threshold: "20"

# Regime sizing multipliers (applied to risk_lots, never breaches hard caps)
regime_sizing:
  strong_bull:
    long_multiplier: "1.5"
    short_multiplier: "0.3"
  mild_bull:
    long_multiplier: "1.2"
    short_multiplier: "0.5"
  neutral:
    long_multiplier: "0.8"
    short_multiplier: "0.8"
  mild_bear:
    long_multiplier: "0.5"
    short_multiplier: "1.2"
  strong_bear:
    long_multiplier: "0.3"
    short_multiplier: "1.5"
